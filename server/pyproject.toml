[project]
name = "stepquest"
version = "0.1.0"
description = "Step Quest server: steps, coins, friends, leaderboard"
authors = [
    { name = "Daniel Than" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
